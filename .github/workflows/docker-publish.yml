name: Docker

# Release 发布时构建多架构镜像并推送 GHCR，与二进制发布同事件、
# 同 tag 注入 VERSION，保证镜像内版本与 Release 附件一致。
# 支持手动 workflow_dispatch（默认推 :sha- 与分支标签，可指定 version）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "镜像内二进制版本号，留空则使用 manual-<短SHA>"
        required: false
        default: ""

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # images 自动小写化（owner 为 LinuxSuRen）
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=open-pdf
            org.opencontainers.image.description=PDF toolbox service: merge, split, compress, watermark, rotate, encrypt PDFs and convert Markdown to PDF
            org.opencontainers.image.licenses=Apache-2.0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
          else
            v="${{ github.event.inputs.version }}"
            [ -n "$v" ] || v="manual-${GITHUB_SHA::7}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
